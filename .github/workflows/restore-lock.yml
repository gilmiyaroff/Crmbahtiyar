name: Restore exact Leadflow lockfile

on:
  push:
    paths:
      - "_upload/READY_LOCK"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact package-lock.json
        run: |
          cat _upload/lock.b64.part00 _upload/lock.b64.part01 | base64 -d | gunzip > package-lock.json
          test "$(git hash-object package-lock.json)" = "c721305ef9d7b4c8448b520a6b61ea8a5432ea49"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install exact dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Clean temporary files
        run: |
          rm -rf _upload
          rm -f .github/workflows/restore-lock.yml

      - name: Commit exact archive state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Restore exact archive lockfile"
          git push
