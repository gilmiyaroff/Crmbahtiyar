name: Finalize Leadflow CRM import

on:
  push:
    paths:
      - "_upload/READY"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble exact stylesheet
        run: cat _upload/styles.part00 _upload/styles.part01 _upload/styles.part02 > src/styles.css

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and production build
        run: npm run build

      - name: Clean temporary import files
        run: |
          rm -rf _upload
          rm -f .gitkeep
          rm -f .github/workflows/finalize-upload.yml

      - name: Commit finalized project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Finalize Leadflow CRM import"
          git push
